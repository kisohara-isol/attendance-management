# ===================================================================
# エラーメッセージ一元管理定義
# ===================================================================

# 全画面共通エラー
E10001=DB接続時にエラーが発生しました。時間を空けて再度実行してください。
W99999=セッションが切れました。再度ログインしてください。

# ログイン画面用 (副田担当)
W10001=IDが入力されていません。IDを入力してください。
W10002=passwordが入力されていません。passwordを入力してください
W10003=IDもしくはpasswordが違います。再度入力してください。
W10004=ログインを３回間違えました。アカウントを停止します。
W10005=このアカウントは現在使えません。

# ログイン画面用 (萩原担当)
W20001=年を入力してください。
W20002=月を入力してください。
W20003=YYYY形式で入力してください。
W20004=1から12の数字を入力してください。

# 勤務追加画面用(加藤担当)
W30001=日付が入力されていません。日付を入力してください。
W30002=出勤時間が入力されていません。出勤時間もしくは「休み」を入力してください。
W30003=不正な値です。日付は「YYYYMMDD」の形式で入力してください。
W30004=不正な値です。出勤日の場合は「HHMM」の形式で時間を、休みの場合は「休み」を入力してください。
W30005=退勤時間が入力されていません。休みの場合は、出勤時間に「休み」を入力したうえで空欄にしてください。
W30006=不正な値です。出勤日の場合は「HHMM」の形式で時間を入力してください。
