<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>勤務表一覧画面</title>
	<meta name="author" content="Hagiwara">
	<style>
		.active {
			background-color: rgb(255, 208, 208)
		}

		th {
			background-color: rgb(215, 227, 253);
		}

		body {
			padding-left: 35px;
			padding-right: 35px;
			padding-top: 10px;
		}

		table {
			width: 60%;
			margin-bottom: 30px;
			table-layout: fixed;
			border-collapse: collapse;
		}

		/* 社員名と対象年月のブロック全体の幅を揃える */
		.shain-info,
		.search-form {
		    max-width: 60%;
		}

		.shain-info {
		    display: block;
		    margin-bottom: 15px; /* 入力欄との間隔 */
		}

		/* ★「社員名：」と「対象年月：」の文字幅を統一して、右側をピタッと揃える */
		.shain-info span:first-child,
		.flex-container > span {
		    display: inline-block;
		    width: 90px; 
			padding-top: 4px;
		}

		/* ★ 横並びのバランスを調整（space-between を gap に変更） */
		.flex-container {
		    display: flex;
		    align-items: flex-start;   
		    gap: 20px;             /* 要素同士の程よい隙間を開ける */
		}

		.search-form input[type="text"] {
		    padding: 4px;
		    width: 70px;           /* 入力欄を少しだけコンパクトに */
		}

		.search-form button {
		    padding: 5px 10px;
		}

		/* ★ エラーメッセージの位置調整 */
		.input-group {
		    display: inline-flex;
		    flex-direction: column; /* 入力欄（input-row）の真下にエラーを出す */
		    align-items: flex-start; /* エラー文字を左寄せにする */
			width: 140px;
		}

		/* ★ 「年」「月」のテキストと入力欄の横並びを完全に固定 */
		.input-row {
		    display: flex;
		    align-items: center;    /* 入力欄と「年」「月」の文字の上下中央揃え */
		    white-space: nowrap;    /* 絶対に途中で改行させないお守り */
		    gap: 5px;               /* 入力欄と「年」「月」の間の隙間 */
		}

		.error-message {
		    color: red;
		    font-size: 0.85em;
		    margin-top: 4px;
		    white-space: nowrap;    /* エラーメッセージも改行させず横に伸ばす */
		}

		hr {
		    border: none;
		    border-top: 1px dashed black;
		    margin-top: 25px;    /* エラーが出ても点線と被らないように余白を確保 */
		}
		
		/* ★ 下のボタン用：左寄せのまま、上のテーブルの左端と縦のラインを合わせる */
			.left-align-container {
			display: flex;
			justify-content: flex-start;
			/* 左寄せ */
			gap: 40px;
			/* ボタン同士のすき間 */
			margin-bottom: 15px;
		}
	</style>
</head>

<div>

	<div>
		<h2> 勤務表</h2>

		<div class="shain-info">
			<span> 社員名：</span>
			<span> [[${shain.shainName}]]</span>
		</div>

		<form class="search-form" th:action="@{/attendance/management/worktable}" th:object="${WorkTableRequest}"
			method="post" style="margin-top: 10px;">

			<div class="flex-container">
				<span> 対象年月： </span>

				<div class="input-group">
					<div class="input-row">
					<input type="text" th:field="*{workYear}"> 年
					</div><span class="error-message" th:if="${#fields.hasErrors('workYear')}" th:errors="*{workYear}"></span>
				</div>

				<div class="input-group">
					<div class="input-row">
					<input type="text" th:field="*{workMonth}"> 月
					</div><span class="error-message" th:if="${#fields.hasErrors('workMonth')}"
						th:errors="*{workMonth}"></span>
				</div>

				<button type="submit">表示</button>
			</div>
		</form>
		
	<hr align=center color=black><br>

	<table th:if="${workList}" border="1">
		<tr>
			<th>日付</th>
			<th>曜日</th>
			<th>出勤</th>
			<th>退勤</th>
			<th>残業時間</th>
			<th>備考</th>
			<th>勤務時間修正</th>
		</tr>
		<tr th:each="work : ${workList}"th:classappend="${work.minutes < 480 &amp;&amp; work.minutes > 0} ? 'active' : ''">
			<td th:text="${work.workDay}"></td>
			<td th:text="${work.dayOfWeek}" th:style="${work.breakDay} ? 'color: red;' : 'color: black;'"></td>
			<td th:text="${work.breakDay} ? '休み' : ${work.startTime}"></td>
			<td th:text="${work.endTime}"></td>
			<td th:text="${work.minutes > 480 ? work.overTime : null}"></td>
			<td th:text="${work.note}"></td>
			<td>
				<a th:href="@{/attendance/management/retouch(
					workDay=${work.workDay}, 
					startTime=${work.startTime}, 
					endTime=${work.endTime}, 
					note=${work.note}
					)}" style="display: block; text-align: center; color: #0066cc; font-weight: bold;">修正</a>
				</td>
		</tr>
	</table>
			
	<div class="left-align-container">
				<a th:href="@{/attendance/management/workinput}">勤務を追加</a>
				<a id="admin-panel" th:if="${shain.shainName == '木曽原'}" th:href="@{/attendance/management/restore}">社員復旧</a>
	</div>

	<br>
	<div><a th:href="@{/attendance/management/login}">ログアウト</a></div>

	</body>

</html>
