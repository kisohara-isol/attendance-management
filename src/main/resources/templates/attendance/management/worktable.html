<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>勤務表一覧画面</title>
	<meta name="author" content="Hagiwara">
	<style>
		.active {
			background-color: rgb(255, 208, 208)
		}

		th {
			background-color: rgb(215, 227, 253);
		}

		body {
			padding-left: 35px;
			padding-right: 35px;
			padding-top: 10px;
		}

		/* ★ 新設：画面内のすべての主要ブロックの幅を60%に統一し、中央に寄せるための共通枠 */
		.main-container {
			width: 60%;
			margin: 0 auto;
			/* 左右を auto にして画面の真ん中に配置 */
		}

		/* ★ タイトルや社員情報もこの枠を基準にする */
		h2 {
			margin-top: 10px;
			margin-bottom: 20px;
		}

		/* テーブルを中央の枠幅いっぱいに広げる */
		table {
			width: 100%;
			/* 親の main-container（60%）に対して100%にする */
			margin-bottom: 30px;
			table-layout: fixed;
			border-collapse: collapse;
		}

		/* テーブル内の文字、時間、修正リンクをすべて自動で真ん中にする */
		table th,
		table td {
			text-align: center;
			vertical-align: middle;
			padding: 8px 4px;
		}

		.shain-info {
			display: block;
			margin-bottom: 15px;
		}

		/* 「社員名：」と「対象年月：」の文字幅を統一 */
		.shain-info span:first-child,
		.flex-container>span {
			display: inline-block;
			width: 90px;
			padding-top: 4px;
		}

		/* 横並びのバランスを調整 */
		.flex-container {
			display: flex;
			align-items: flex-start;
			gap: 20px;
		}

		.search-form input[type="text"] {
			padding: 4px;
			width: 70px;
		}

		.search-form button {
			padding: 5px 10px;
		}

		/* エラーメッセージの位置調整 */
		.input-group {
			display: inline-flex;
			flex-direction: column;
			align-items: flex-start;
			width: 140px;
		}

		/* 「年」「月」のテキストと入力欄の横並び */
		.input-row {
			display: flex;
			align-items: center;
			white-space: nowrap;
			gap: 5px;
		}

		.error-message {
			color: red;
			font-size: 0.85em;
			margin-top: 4px;
			white-space: nowrap;
		}

		/* 区切り線も幅を揃えて中央寄せ */
		hr {
			border: none;
			border-top: 1px dashed black;
			margin-top: 25px;
			margin-bottom: 25px;
		}

		/* ★ 下のボタン用：左寄せのまま、上のテーブルの左端と縦のラインを合わせる */
		.left-align-container {
			display: flex;
			justify-content: flex-start;
			/* 左寄せ */
			gap: 40px;
			/* ボタン同士のすき間 */
			margin-bottom: 15px;
		}
	</style>
</head>

<body>

	<div class="main-container">

		<h2> 勤務表</h2>

		<div class="shain-info">
			<span> 社員名：</span>
			<span> [[${shain.shainName}]]</span>
		</div>

		<form class="search-form" th:action="@{/attendance/management/worktable}" th:object="${WorkTableRequest}"
			method="post">
			<div class="flex-container">
				<span> 対象年月： </span>

				<div class="input-group">
					<div class="input-row">
						<input type="text" th:field="*{workYear}"> 年
					</div>
					<span class="error-message" th:if="${#fields.hasErrors('workYear')}" th:errors="*{workYear}"></span>
				</div>

				<div class="input-group">
					<div class="input-row">
						<input type="text" th:field="*{workMonth}"> 月
					</div>
					<span class="error-message" th:if="${#fields.hasErrors('workMonth')}"
						th:errors="*{workMonth}"></span>
				</div>

				<button type="submit">表示</button>
			</div>
		</form>

		<hr>

		<table th:if="${workList}" border="1">
			<thead>
				<tr>
					<th>日付</th>
					<th>曜日</th>
					<th>出勤</th>
					<th>退勤</th>
					<th>残業時間</th>
					<th>備考</th>
					<th>勤務時間修正</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="work : ${workList}"
					th:classappend="${work.minutes < 480 &amp;&amp; work.minutes > 0} ? 'active' : ''">
					<td th:text="${work.workDay}"></td>
					<td>
						<span th:text="${work.dayOfWeek}"
							th:style="${work.breakDay} ? 'color: red;' : 'color: black;'"></span>
					</td>
					<td th:text="${work.breakDay} ? '休み' : ${work.startTime}"></td>
					<td th:text="${work.breakDay} ? '—' : ${work.endTime}"></td>
					<td th:text="${work.minutes > 480 ? work.overTime : '—'}"></td>
					<td th:text="${work.note}"></td>

					<td>
						<a th:href="@{/attendance/management/retoch(
						        workDay=${work.workDay}, 
						        startTime=${work.startTime}, 
						        endTime=${work.endTime}, 
						        note=${work.note}
						    )}" style="display: block; text-decoration: none; color: #0066cc; font-weight: bold;">修正</a>
					</td>
				</tr>
			</tbody>
		</table>

		<div class="left-align-container">
			<a th:href="@{/attendance/management/workinput}">勤務を追加</a>

			<a id="admin-panel" th:if="${shain.shainName == '木曽原'}" th:href="@{/attendance/management/restore}">
				社員復旧
			</a>
		</div>

		<div>
			<a th:href="@{/attendance/management/login}" style="color: #0066cc; text-decoration: none;">ログアウト</a>
		</div>

	</div>
</body>

</html>
