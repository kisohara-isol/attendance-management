<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>勤務表一覧画面</title>
	<meta name="author" content="Hagiwara">
	<style>
		.active {
			background-color: rgb(255, 208, 208)
		}

		th {
			background-color: rgb(215, 227, 253);
		}

		body {
			padding-left: 35px;
			padding-right: 35px;
			padding-top: 10px;
		}

		table {
			width: 60%;
			margin-bottom: 30px;
			table-layout: fixed;
			border-collapse: collapse;
		}

		.shain-info,
		.search-form {
			max-width: 60%;
		}

		.shain-info {
			display: block;
			margin-bottom: 15px;
		}

		.shain-info span:first-child,
		.flex-container>span {
			display: inline-block;
			width: 90px;
			padding-top: 4px;
		}

		.flex-container {
			display: flex;
			align-items: flex-start;
			gap: 20px;
		}

		.search-form input[type="text"] {
			padding: 4px;
			width: 70px;
		}

		.search-form button {
			padding: 5px 10px;
		}

		.input-group {
			display: inline-flex;
			flex-direction: column;
			align-items: flex-start;
			width: 140px;
		}

		.input-row {
			display: flex;
			align-items: center;
			white-space: nowrap;
			gap: 5px;
		}

		.error-message {
			color: red;
			font-size: 0.85em;
			margin-top: 4px;
			white-space: nowrap;
		}

		hr {
			border: none;
			border-top: 1px dashed black;
			margin-top: 25px;
		}

		.left-align-container {
			display: flex;
			justify-content: flex-start;
			gap: 40px;
			margin-bottom: 15px;
		}
	</style>
</head>

<body>
	<div>
		<h2>勤務表</h2>

		<div class="shain-info">
			<span>社員名：</span>
			<span>[[${shain.shainName}]]</span>
		</div>

		<form class="search-form" th:action="@{/attendance/management/worktable}" th:object="${WorkTableRequest}"
			method="post" style="margin-top: 10px;">

			<div class="flex-container">
				<span>対象年月：</span>

				<div class="input-group">
					<div class="input-row">
						<input type="text" th:field="*{workYear}"> 年
					</div>
					<span class="error-message" th:if="${#fields.hasErrors('workYear')}" th:errors="*{workYear}"></span>
				</div>

				<div class="input-group">
					<div class="input-row">
						<input type="text" th:field="*{workMonth}"> 月
					</div>
					<span class="error-message" th:if="${#fields.hasErrors('workMonth')}"
						th:errors="*{workMonth}"></span>
				</div>

				<button type="submit">表示</button>
			</div>
		</form>

		<hr align="center"><br>

		<div th:if="${errorMessage}">
			<div>
				<th:block><span style="color: red;">[[${errorMessage}]]</span></th:block>
			</div>
		</div>

		<table th:if="${workList}" border="1">
			<tr>
				<th>日付</th>
				<th>曜日</th>
				<th>出勤</th>
				<th>退勤</th>
				<th>残業時間</th>
				<th>備考</th>
				<th>勤務変更</th>
			</tr>
			<tr th:each="work : ${workList}"
				th:classappend="${work.minutes != null && work.minutes < 480 && work.minutes > 0} ? 'active' : ''">

				<td th:text="${work.workDay}"></td>

				<td th:text="${work.dayOfWeek}"
					th:style="${work.breakDay || '有給'.equals(work.note)} ? 'color: red;' : 'color: black;'"></td>

				<td th:text="${work.breakDay} ? '休み' : (${work.startTime} == '00:00' ? '' : ${work.startTime})"></td>
				<td th:text="${work.breakDay} ? '' : (${work.endTime} == '00:00' ? '' : ${work.endTime})"></td>

				<td th:text="${work.overTime}"></td>

				<td th:text="${work.note}"></td>
				<td>
					<form th:action="@{/attendance/management/worktable/to-input}" method="post">
						<input type="hidden" name="workYear" th:value="${WorkTableRequest.workYear}">
						<input type="hidden" name="workMonth" th:value="${WorkTableRequest.workMonth}">
						<input type="hidden" name="selectedDay" th:value="${work.workDay}">
						<input type="submit"
							style="display: inline-block; text-align: center; color: #0066cc; font-weight: bold; cursor: pointer; padding: 2px 10px;"
							value="変更">
					</form>
				</td>
			</tr>
		</table>
		<form th:action="@{/attendance/management/to_worksubmission}" th:object="${WorkTableRequest}" method="post"
			style="display: inline;">
			<input type="hidden" th:field="*{workYear}">
			<input type="hidden" th:field="*{workMonth}">
			<input type="submit" value="確定申請">
		</form>

		<a id="admin-panel" th:if="${shain.loginId == 'kisohara'}" th:href="@{/attendance/management/restore}"
			style="margin-left: 40px;">社員復旧</a>
	</div>
	<br>
	<div><a th:href="@{/attendance/management/login}">ログアウト</a></div>

</body>

</html>
