<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>ログイン画面
	</title>
	<meta name="author" content="Soeda">
	<style>
		/* 画面中央に綺麗に配置するためのシンプルなデザイン */
		.login-container {
			width: 600px;
			margin: 200px auto;
			/*  修正後：左側（最後）の数字だけ「50px（30 + 20）」にする！ */
			padding: 30px 30px 30px 300px;
			border: 1px solid #ccc;
			border-radius: 8px;
			box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
			font-family: "Helvetica Neue", Arial, sans-serif;
		}

		/* 文字と入力欄を横並びにする設定 */
		.form-row {
			display: flex;
			/* 中身（文字と入力欄）を横並びにする */
			align-items: center;
			/* 上下の中心を揃えて綺麗に並べる */
			margin-bottom: 15px;
			/* 行と行の間に少し隙間（下余白）を作る */
			margin-left: 0px;
			/* 左側に20pxの余白を作って、全体を右に押す */
		}

		/* 「ログインID：」の文字の横幅を固定して、入力欄の左端を綺麗に揃える */
		.form-label {
			width: 110px;
			/* 文字エリアの幅を110ピクセルに固定 */
			display: inline-block;
		}

		.submit-btn {
			width: 15%;
			padding: 10px;
			background-color: #007bff;
			color: white;
			border: none;
			border-radius: 4px;
			font-size: 16px;
			cursor: pointer;
			margin-bottom: 20px;
		}

		.submit-btn:hover {
			background-color: #0056b3;
		}

		.error-message {
			color: #dc3545;
			background-color: #f8d7da;
			border: 1px solid #f5c6cb;
			padding: 10px;
			border-radius: 4px;
			margin-bottom: 15px;
			font-size: 14px;
		}
	</style>
</head>

<body>
	<div class="login-container">
		<h2>ログイン画面</h2>
		<div>ログインIDとパスワードを入力してください。<br><br></div>
		<form th:action="@{/attendance/management/login}" th:object="${loginRequest}" th:method="post">
			<div class="form-row">
				<label class="form-label">ログインID：</label>
				<input type="text" name="loginId" size="20" /><br>
			</div>

			<div class="form-row">
				<label class="form-label">パスワード：</label>
				<input type="text" name="password" size="20" /><br>
			</div>
			<input type="submit" class="submit-btn" value="ログイン">
			<br>
			<div th:if="${errorMessage}">
				<div>
					<font color="red">[[${errorMessage}]]</font>
				</div>
			</div>
	</div>
	</form>

</body>

</html>
